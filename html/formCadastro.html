<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro - FastNotes</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background-color:#234B7F;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.form-container{
background:#fff;
padding:2rem;
border-radius:10px;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
width:100%;
max-width:400px;
}

</style>
</head>

<body>

<div class="form-container">

<h2 class="text-center mb-4">Criar Conta no FastNotes</h2>

<form id="cadastroForm">

<div class="mb-3">
<label class="form-label">Nome</label>
<input type="text" class="form-control" id="nome" required>
</div>

<div class="mb-3">
<label class="form-label">E-mail</label>
<input type="email" class="form-control" id="email" required>
</div>

<div class="mb-3">
<label class="form-label">Senha</label>
<input type="password" class="form-control" id="senha" required>
</div>

<div class="mb-3">
<label class="form-label">Confirmar Senha</label>
<input type="password" class="form-control" id="confirmarSenha" required>
</div>

<div class="d-grid">
<button class="btn btn-success">Cadastrar</button>
</div>

</form>

<p class="text-center mt-3">
Já tem conta? <a href="formLogin.html">Entrar</a>
</p>

</div>

<script>

document.getElementById("cadastroForm").addEventListener("submit", function(e){

e.preventDefault()

const nome = document.getElementById("nome").value.trim()
const email = document.getElementById("email").value.trim()
const senha = document.getElementById("senha").value
const confirmar = document.getElementById("confirmarSenha").value


if(senha !== confirmar){
alert("As senhas não coincidem!")
return
}


let usuarios = JSON.parse(localStorage.getItem("usuarios")) || []


const existe = usuarios.find(u => u.email === email)

if(existe){
alert("Este email já está cadastrado.")
return
}


const usuario = {
nome,
email,
senha,
imagem: "https://ui-avatars.com/api/?name=" + encodeURIComponent(nome)
}


usuarios.push(usuario)

localStorage.setItem("usuarios", JSON.stringify(usuarios))
localStorage.setItem("currentUser", JSON.stringify(usuario))

window.location.href="home.html"

})

</script>

</body>
</html>
