<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FastNotes - Bloco</title>
  <link rel="stylesheet" href="/css/bloco.css" />

</head>

<body>

  <header class="AppNome d-flex justify-content-between p-3 bg-primary text-white" style="margin-bottom: 1vw">
    <h1 class="m-0" onclick="backHome()">FastNotes</h1>
    <span id="userName"></span>
    <div class="logout-btn">
      <svg onclick="logOut()" id="logoutIcon" xmlns="http://www.w3.org/2000/svg" width="5vw" height="5vw"
        viewBox="0 0 24 24" fill="currentColor" style=" cursor: pointer;">
        <path d="M3 3h10a1 1 0 0 1 1 1v4h-2V5H5v14h7v-3h2v4a1 1 0 0 1-1 1H3z" />
        <path d="M14 12l-3-3v2H7v2h4v2z" />
        <path d="M11 11h10v2H11z" />
      </svg>
    </div>
  </header>

  <div style="display: inline; width: 100%;">
    <div class="color-picker" style="margin: 3vw; float: right;">
      <div class="selected-color" id="selectedColor" style="background:#fff475"></div>
      <div class="color-palette" id="colorPalette" style="display:none;">
        <div class="color" data-color="#ffffff" style="background:#ffffff"></div>
        <div class="color" data-color="#f28b82" style="background:#f28b82"></div>
        <div class="color" data-color="#fbbc04" style="background:#fbbc04"></div>
        <div class="color" data-color="#fff475" style="background:#fff475"></div>
        <div class="color" data-color="#ccff90" style="background:#ccff90"></div>
        <div class="color" data-color="#a7ffeb" style="background:#a7ffeb"></div>
        <div class="color" data-color="#cbf0f8" style="background:#cbf0f8"></div>
        <div class="color" data-color="#aecbfa" style="background:#aecbfa"></div>
        <div class="color" data-color="#d7aefb" style="background:#d7aefb"></div>
      </div>
    </div>
  </div>

  <div style="margin-left: 3vw;" >
    <main class="container">
      <h2 id="blockTitle" contenteditable="true" onblur="saveTitle()" style="width: 85%;"></h2>

      <div id="editorArea">
        <div id="noteEditor" class="" contenteditable="true" oninput="saveNote()"></div>
      </div>
    </main>
  </div>
  <!-- Botão para abrir a calculadora -->
  <button class="btn btn-primary toggle-calc-btn" onclick="toggleCalculator()" style="background: #234B7F; border-radius: 6px; font-family: 'Times New Roman', Times, serif; font-weight: bold;">Calculadora</button>

  <!-- Calculadora flutuante -->
  <div class="calculator" id="calculator" style="background:rgb(255, 255, 255);">
    <header style="width: 100%;">
      <div style="text-align: left; position:relative; column-fill: auto; display: inline; margin-top: -2vw;" >
        <p>Calculadora</p>
        <div class="close-btn">
          <svg onclick="closeCalculator()" xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" 
            viewBox="0 0 24 24" fill="currentColor" style="cursor: pointer; float:right; display: inline; margin-top: -7vw;">
            <path d="M20 6L6 6l12 15" />
          </svg>
        </div>
      </div>
    </header>
    <div style="margin: 2vw;">
      <input type="text" class="calc-display" id="calcDisplay" />
      <div class="calc-buttons" >
        <button onclick="appendCalc('7')">7</button>
        <button onclick="appendCalc('8')">8</button>
        <button onclick="appendCalc('9')">9</button>
        <button onclick="appendCalc('/')">÷</button>

        <button onclick="appendCalc('4')">4</button>
        <button onclick="appendCalc('5')">5</button>
        <button onclick="appendCalc('6')">6</button>
        <button onclick="appendCalc('*')">×</button>

        <button onclick="appendCalc('1')">1</button>
        <button onclick="appendCalc('2')">2</button>
        <button onclick="appendCalc('3')">3</button>
        <button onclick="appendCalc('-')">−</button>

        <button onclick="appendCalc('0')">0</button>
        <button onclick="appendCalc('.')">.</button>
        <button onclick="calculateCalc()">=</button>
        <button onclick="appendCalc('+')">＋</button>
        <button class="clear" onclick="clearCalc()" style="grid-column: span 4; margin-bottom: 2vw; 
      ">Limpar</button>
      </div>

    </div>
  </div>

  <script src="/js/bloco.js"></script>
</body>

</html>
