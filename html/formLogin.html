<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - FastNotes</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex justify-content-center align-items-center vh-100 bg-light">

<div class="card p-4 shadow" style="min-width:320px">

<h3 class="text-center mb-3">Entrar no FastNotes</h3>

<form id="loginForm">

<div class="mb-3">
<label>E-mail</label>
<input id="loginEmail" type="email" class="form-control" required>
</div>

<div class="mb-3">
<label>Senha</label>
<input id="loginPassword" type="password" class="form-control" required>
</div>

<button class="btn btn-primary w-100">Entrar</button>

</form>

<p class="text-center mt-3"><a href="formCadastro.html">Não tem conta? Cadastrar</a></p>

</div>

<script src="js/login.js"></script>

</body>
</html>
