<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>FastNotes - Início</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <header>
    <h1>FastNotes</h1>
    <nav>
      <span id="userName">Olá, Convidado</span>
      <img id="userImg" src="imgs/default-user.png" alt="Perfil" />
      <a href="profile.html">Perfil</a>
      <a href="#" onclick="logout()">Sair</a>
    </nav>
  </header>
  <main>
    <div class="cards" id="cardsContainer"></div>
    <button class="btn-floating" onclick="openMenu()">+</button>
  </main>
  <div class="overlay" id="menuOverlay" onclick="closeMenu()">
    <div class="modal-menu" onclick="event.stopPropagation()">
      <button onclick="createItem('noteBlock')">📓 Bloco de Notas</button>
      <button onclick="createItem('taskList')">📝 Lista de Tarefas</button>
      <button onclick="createItem('table')">📊 Tabela</button>
      <button onclick="closeMenu()">Cancelar</button>
    </div>
  </div>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
